name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  REGISTRY: ghcr.io
jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
          repository: Muxcore-Media/core
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: backup-local
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - working-directory: ./backup-local
        run: go vet ./...

  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
          repository: Muxcore-Media/core
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: backup-local
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - working-directory: ./backup-local
        run: go test -count=1 -timeout 10m ./...

  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
          repository: Muxcore-Media/core
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: backup-local
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - working-directory: ./backup-local
        run: |
          go build -o /dev/null ./cmd/module
          go vet ./...

  docker:
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: self-hosted
    needs: [lint, test, build]
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
          repository: Muxcore-Media/core
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: backup-local
      - uses: docker/setup-buildx-action@v4
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backup-local/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
