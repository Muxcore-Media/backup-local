name: Release
on:
  push:
    tags: ["v*"]

env:
  GOPRIVATE: github.com/Muxcore-Media/*
jobs:
  goreleaser:
    runs-on: self-hosted
    steps:
      - uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - name: Configure private modules (HTTPS)
        run: |
          git config --global url."https://x-access-token:${{ secrets.MUXCORE_CI_TOKEN || github.token }}@github.com/".insteadOf "https://github.com/"
      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/backup-local-linux-amd64 ./cmd/module
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/backup-local-linux-arm64 ./cmd/module
      - name: Lowercase image name
        run: |
          echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/backup-local:${{ github.ref_name }}
            ghcr.io/${{ env.IMAGE_OWNER }}/backup-local:latest
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
